[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssbu-matchups"
version = "0.1.0"
description = "Tools and utilities for character matchup analysis for Super Smash Bros. Ultimate"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "TwistPickle" }]
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "requests",
    "python-dotenv",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
    "nbstripout",
    "ipykernel",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
